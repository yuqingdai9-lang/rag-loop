name: Synthetic CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Public CI verifies the template only. It has no model credentials or local data.
permissions:
  contents: read

concurrency:
  group: synthetic-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Synthetic checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out the template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v

      - name: Run the synthetic loop demo
        run: python loop_core.py demo --output .ci-output/synthetic
